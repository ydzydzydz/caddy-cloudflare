name: Build and Publish Docker Image

on:
  schedule:
    - cron: '0 18 * * *' # 每天 UTC 18:00（北京时间凌晨 2 点）
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建（跳过版本检查）'
        required: false
        type: boolean
        default: false

env:
  REGISTRY_GHCR: ghcr.io
  # ghcr.io/<owner>/<repo>，GitHub 自动转小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # secrets 不能用于 if 表达式，通过 env 中转
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get latest Caddy version
        id: caddy
        run: |
          VERSION=$(curl -sf https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest Caddy version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if version already built
        if: inputs.force != true
        id: check
        run: |
          IMAGE="${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}"
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.caddy.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.caddy.outputs.version }} already built, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/{1}', env.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.caddy.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.caddy.outputs.version }}

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
            linux/arm/v6
            linux/riscv64
            linux/ppc64le
            linux/s390x
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.caddy.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
