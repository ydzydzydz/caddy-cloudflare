name: Build and Publish Docker Image

on:
  schedule:
    - cron: '0 18 * * *' # 每天 UTC 18:00（北京时间凌晨 2 点）
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建（跳过版本检查）'
        required: false
        type: boolean
        default: false

env:
  REGISTRY_GHCR: ghcr.io
  # ghcr.io/<owner>/<repo>，GitHub 自动转小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  determine-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine versions to build
        id: versions
        run: |
          FORCE=${{ inputs.force == true }}
          # 拉取最近 10 个 release，过滤 pre-release 后取前 5 个，
          # 避免一天内发多版时只取 latest 导致中间版本遗漏
          VERSIONS=$(curl -sf "https://api.github.com/repos/caddyserver/caddy/releases?per_page=10" \
            | jq -r '[.[] | select(.prerelease == false) | .tag_name | sub("^v"; "")] | .[0:5]')
          echo "Recent releases: $VERSIONS"

          TO_BUILD='[]'
          FIRST=true
          for v in $(echo "$VERSIONS" | jq -r '.[]'); do
            # 只有真正最新的 release 才打 latest 标签
            IS_LATEST=$FIRST
            FIRST=false

            # 若非强制重建，跳过已构建的版本
            if [ "$FORCE" != "true" ]; then
              if docker buildx imagetools inspect "${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${v}" > /dev/null 2>&1; then
                echo "Version $v already built, skipping"
                continue
              fi
            fi

            # 用 Docker Hub REST API 检查官方基础镜像是否已发布
            # 同时检查 -alpine 和 -builder，任一缺失都说明官方还没构建完，跳过等下次定时任务
            ALPINE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://hub.docker.com/v2/repositories/library/caddy/tags/${v}-alpine")
            BUILDER_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://hub.docker.com/v2/repositories/library/caddy/tags/${v}-builder")

            if [ "$ALPINE_STATUS" = "200" ] && [ "$BUILDER_STATUS" = "200" ]; then
              TO_BUILD=$(echo "$TO_BUILD" | jq \
                --arg v "$v" \
                --argjson latest "$IS_LATEST" \
                '. + [{version: $v, is_latest: $latest}]')
              echo "Version $v -> build (latest=$IS_LATEST)"
            else
              echo "Base images for $v not ready (alpine=$ALPINE_STATUS, builder=$BUILDER_STATUS), skipping"
            fi
          done

          # GITHUB_OUTPUT 不支持值中含换行，用 jq -c 压缩成单行 JSON
          echo "matrix=$(echo "$TO_BUILD" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Versions to build: $TO_BUILD"

  build-and-push:
    needs: determine-versions
    if: needs.determine-versions.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.determine-versions.outputs.matrix) }}
    env:
      # secrets 不能用于 if 表达式，通过 env 中转
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/{1}', env.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.is_latest }}
            type=semver,pattern={{version}},value=${{ matrix.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
            linux/arm/v6
            linux/riscv64
            linux/ppc64le
            linux/s390x
          push: true
          build-args: |
            CADDY_VERSION=${{ matrix.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
